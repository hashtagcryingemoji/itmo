# Execution limits
limit: 1000            # Maximum instructions to execute
memory_size: 8192      # Memory size in bytes

# I/O configuration
memory_mapped_io:
  0x80: [2147483647]      # Input values at address 0x80
  132: []             # Output-only port at address 0x84

# Reports configuration
reports:
  - name: "Execution trace"
    slice: all
    view: |
      {pc}: {instruction:next} {pc:label}
  
  - name: "dump"
    slice: last
    view: |
      mem {memory:0:8090}

  - name: "Result verification"
    slice: last
    view: |
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x84]: [] >>> [0]
 
