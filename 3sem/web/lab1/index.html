<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>lab1 web</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<table id="main-table">
    <tr>
        <td>
            <header>
                <p>Трифан Тимофей Андреевич</p>
                <p>Группа P3215</p>
                <p>Вариант 12731</p>
            </header>
        </td>
    </tr>
    <tr>
        <td>
            <canvas id="main-canvas" width="600" height="400"></canvas>
        </td>
    </tr>
    <tr>
        <td>
            <form id="form" novalidate>
                <label class="form-row">
                    X:
                    <span class="x-buttons">
                        <button type="button" value="-5" class="x-button">-5</button>
                        <button type="button" value="-4" class="x-button">-4</button>
                        <button type="button" value="-3" class="x-button">-3</button>
                        <button type="button" value="-2" class="x-button">-2</button>
                        <button type="button" value="-1" class="x-button">-1</button>
                        <button type="button" value="0" class="x-button">0</button>
                        <button type="button" value="1" class="x-button">1</button>
                        <button type="button" value="2" class="x-button">2</button>
                        <button type="button" value="3" class="x-button">3</button>
                    </span>
                </label>

                <label class="form-row">
                    Y (-3 ... 5):
                    <input id="y-input" type="text" name="y" placeholder="число от -3 до 5">
                </label>

                <label class="form-row">
                    R:
                    <select id="r-select" name="r">
                        <option>1</option>
                        <option>1.5</option>
                        <option>2</option>
                        <option>2.5</option>
                        <option>3</option>
                    </select>
                </label>

                <div id="error-message"></div>

                <button id="submit-button" type="submit">Проверить</button>
            </form>
        </td>
    </tr>
    <tr>
        <td>
            <button type="button" id="clear-button">Очистить историю</button>
            <table id="results-table">
                <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Результат</th>
                    <th>Дата и время проверки</th>
                </tr>
                </thead>
                <tbody id="results-body">
                </tbody>
            </table>
        </td>
    </tr>
    <tr>
        <td id="comment-td">
            <div id="comment" contenteditable="plaintext-only"></div>
        </td>
    </tr>
</table>
<script src="script.js"></script>
</body>
</html>
